# V7 路径配置模板
# 优先级：环境变量 > 本文件默认值
# 所有路径可基于 %REPO_ROOT%（仓库根目录）或绝对路径

# lalala 目录（含 state.py / action.py / utils.py；批跑 import 用）
# 环境变量 LALALA_DIR 优先生效
lalala_dir: "%REPO_ROOT%/guandan_offline_v1006/lalala"

# 离线服务器 exe（治理口径：offline_platform/…；不存在时 v7_paths 回退 guandan_offline_v1006/…）
# 环境变量 SERVER_EXE 优先生效
server_exe: "%REPO_ROOT%/offline_platform/guandan_offline_v1006/windows/guandan_offline_v1006.exe"

# 模型权重目录
# 环境变量 MODEL_DIR 优先生效
model_dir: "%REPO_ROOT%/models"

# 默认模型文件名（也可用环境变量 V7_MODEL_PATH 指向完整路径）
model_file: "bc_model_ultimate_win_rate.pth"

# 默认服务器参数（传给 exe 的 argv；须配合 batch_executor 使用 3 的倍数）
server_args: "12"
