# 高级规则示例文件
# 展示如何使用嵌套条件和函数调用

rules:
  # 示例1：使用嵌套条件
  - id: complex_teammate_protection
    name: 复杂队友保护规则
    description: 使用嵌套条件判断队友保护
    condition:
      type: and
      conditions:
        - type: or
          conditions:
            - field: greater_pos
              op: "=="
              value: teammate_pos
            - field: cur_pos
              op: "=="
              value: teammate_pos
        - field: teammate_cards
          op: "<="
          value: 5
        - type: not
          condition:
            field: min_opponent_cards
            op: "<="
            value: 3
    actions:
      - action_type: PASS
        score_adjust: 120
    priority: 9
    game_phase: endgame

  # 示例2：使用函数调用
  - id: endgame_bomb_strategy
    name: 残局炸弹策略
    description: 使用函数判断残局并使用炸弹
    condition:
      type: and
      conditions:
        - type: function
          name: is_endgame
          args: []
        - type: function
          name: has_bomb
          args: []
        - field: min_opponent_cards
          op: "<="
          value: 3
    actions:
      - action_type: Bomb
        score_adjust: 200
    priority: 10
    game_phase: endgame

  # 示例3：使用函数计算字段值
  - id: dynamic_threshold
    name: 动态阈值规则
    description: 使用函数计算动态阈值
    condition:
      type: and
      conditions:
        - field:
            type: function
            name: min
            args:
              - field: teammate_cards
              - field: min_opponent_cards
          op: "<="
          value:
            type: function
            name: max
            args: [5, 8]
    actions:
      - action_type: PASS
        score_adjust: 100
    priority: 7

  # 示例4：使用in操作符
  - id: card_type_check
    name: 牌型检查规则
    description: 检查当前牌型是否在允许列表中
    condition:
      type: and
      conditions:
        - field: action_type
          op: in
          value: [Pair, ThreeWithTwo, Straight]
        - field: teammate_cards
          op: "<="
          value: 5
    actions:
      - action_type: other
        score_adjust: 80
    priority: 6

  # 示例5：复杂嵌套条件
  - id: complex_opponent_suppress
    name: 复杂对手压制
    description: 使用多层嵌套条件
    condition:
      type: and
      conditions:
        - type: or
          conditions:
            - field: min_opponent_cards
              op: "<="
              value: 3
            - type: and
              conditions:
                - field: min_opponent_cards
                  op: "=="
                  value: 4
                - type: function
                  name: has_bomb
                  args: []
        - type: not
          condition:
            field: greater_pos
            op: "=="
            value: teammate_pos
    actions:
      - action_type: Bomb
        score_adjust: 150
      - action_type: other
        score_adjust: 100
    priority: 9
    game_phase: endgame

# 函数说明
functions:
  min:
    description: 返回参数中的最小值
    args: [value1, value2, ...]
    example: min(teammate_cards, min_opponent_cards)
  
  max:
    description: 返回参数中的最大值
    args: [value1, value2, ...]
    example: max(5, 8)
  
  abs:
    description: 返回绝对值
    args: [value]
    example: abs(score_difference)
  
  sum:
    description: 返回参数的和
    args: [value1, value2, ...]
    example: sum(card_counts)
  
  has_bomb:
    description: 检查是否有炸弹（剩余4张牌）
    args: []
    example: has_bomb()
  
  is_endgame:
    description: 判断是否残局（最少牌数<=5）
    args: []
    example: is_endgame()

# 操作符说明
operators:
  "==": 等于
  "!=": 不等于
  "<": 小于
  "<=": 小于等于
  ">": 大于
  ">=": 大于等于
  "in": 在列表中
  "not_in": 不在列表中

# 逻辑组合
logic_types:
  "and": 所有条件都满足
  "or": 任一条件满足
  "not": 条件不满足

