# 结构化规则示例文件
# 此文件展示了如何在知识库中定义结构化规则

# 规则定义格式
rules:
  # 规则1：队友保护-即将获胜
  - id: teammate_protection_1_2
    name: 队友保护-即将获胜
    description: 队友剩余1-2张牌，即将获胜，必须让队友走
    source: 传牌技巧.md
    condition:
      type: and
      conditions:
        - field: greater_pos
          op: "=="
          value: teammate_pos
        - field: teammate_cards
          op: "<="
          value: 2
    actions:
      - action_type: PASS
        score_adjust: 150
        description: 极强烈鼓励PASS，让队友走
      - action_type: other
        score_adjust: -80
        description: 严重惩罚出牌
    priority: 10
    game_phase: endgame
    
  # 规则2：队友保护-残局阶段
  - id: teammate_protection_3_5
    name: 队友保护-残局阶段
    description: 队友剩余3-5张牌，残局阶段，应该保护队友
    source: 传牌技巧.md
    condition:
      type: and
      conditions:
        - field: greater_pos
          op: "=="
          value: teammate_pos
        - field: teammate_cards
          op: "<="
          value: 5
        - field: teammate_cards
          op: ">="
          value: 3
    actions:
      - action_type: PASS
        score_adjust: 100
        description: 强烈鼓励PASS
      - action_type: other
        score_adjust: -50
        description: 惩罚出牌
    priority: 8
    game_phase: endgame
    
  # 规则3：对手压制-即将获胜
  - id: opponent_suppress_1_3
    name: 对手压制-即将获胜
    description: 对手剩余1-3张牌，必须压制
    source: 出炸弹要领.md
    condition:
      type: and
      conditions:
        - field: min_opponent_cards
          op: "<="
          value: 3
    actions:
      - action_type: PASS
        score_adjust: -100
        description: 严重惩罚PASS
      - action_type: other
        score_adjust: 150
        description: 极强烈鼓励出牌压制
    priority: 10
    game_phase: endgame
    
  # 规则4：火不打四
  - id: fire_not_four
    name: 火不打四
    description: 对手4张时可能是炸弹，不要轻易用炸弹
    source: 出炸弹要领.md
    condition:
      type: and
      conditions:
        - field: min_opponent_cards
          op: "=="
          value: 4
    actions:
      - action_type: Bomb
        score_adjust: -30
        description: 避免用炸弹
    priority: 7
    game_phase: endgame
    
  # 规则5：逢五出对
  - id: five_pair
    name: 逢五出对
    description: 对手5张时优先出对子
    source: 对子技巧.md
    condition:
      type: and
      conditions:
        - field: min_opponent_cards
          op: "=="
          value: 5
    actions:
      - action_type: Pair
        score_adjust: 100
        description: 强烈鼓励出对子
      - action_type: other
        score_adjust: 60
        description: 鼓励出牌
    priority: 8
    game_phase: endgame

# 字段说明
field_descriptions:
  greater_pos: 当前最大动作持有者的位置
  teammate_pos: 队友的位置
  teammate_cards: 队友剩余牌数
  min_opponent_cards: 对手最少剩余牌数
  max_opponent_cards: 对手最多剩余牌数
  my_pos: 我的位置
  cur_pos: 当前出牌者的位置

# 操作符说明
operators:
  "==": 等于
  "!=": 不等于
  "<": 小于
  "<=": 小于等于
  ">": 大于
  ">=": 大于等于

# 动作类型说明
action_types:
  PASS: 过牌
  Single: 单张
  Pair: 对子
  Trips: 三张
  ThreeWithTwo: 三带二
  Straight: 顺子
  ThreePair: 三连对
  TwoTrips: 钢板
  StraightFlush: 同花顺
  Bomb: 炸弹
  other: 其他动作类型

