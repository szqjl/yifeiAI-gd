# 传牌技巧规则
# 从 docs/knowledge/skills/03_assist_attack/01_passing_skills.md 提取

rules:
  # 规则1：队友剩5张，判断是三带二
  - id: teammate_5_cards_three_with_two
    name: 队友剩5张判断三带二
    description: 队友剩5张牌，明显是三带二，应该送三带二
    source: 传牌技巧.md
    condition:
      type: and
      conditions:
        - field: teammate_cards
          op: "=="
          value: 5
        - field: phase
          op: "=="
          value: "endgame"
    actions:
      - action_type: ThreeWithTwo
        score_adjust: 150
        description: 强烈鼓励送三带二
    priority: 9
    game_phase: endgame

  # 规则2：队友剩9-10张，尽快送三带二
  - id: teammate_9_10_cards_send_three_with_two
    name: 队友剩9-10张送三带二
    description: 队友剩9-10张牌，尽快要送三带二
    source: 传牌技巧.md
    condition:
      type: and
      conditions:
        - field: teammate_cards
          op: ">="
          value: 9
        - field: teammate_cards
          op: "<="
          value: 10
        - field: phase
          op: "=="
          value: "endgame"
    actions:
      - action_type: ThreeWithTwo
        score_adjust: 100
        description: 鼓励送三带二
    priority: 8
    game_phase: endgame

  # 规则3：队友跟了三连对，送三连对
  - id: teammate_followed_three_pair_send_three_pair
    name: 队友跟三连对送三连对
    description: 队友跟了一手三连对，说明队友可能需要三连对，应该配合送牌
    source: 传牌技巧.md
    condition:
      type: and
      conditions:
        - field: teammate_last_action
          op: "=="
          value: "ThreePair"
        - field: greater_pos
          op: "=="
          value: "teammate_pos"
    actions:
      - action_type: ThreePair
        score_adjust: 120
        description: 鼓励送三连对
    priority: 7
    game_phase: midgame

  # 规则4：队友出过顺子，再出顺子，可能有对子
  - id: teammate_straight_then_straight_has_pair
    name: 队友出顺子后可能有对子
    description: 队友主动出过顺子后，又套了一手顺子，则可能有对子，但一定不会有太多的对子
    source: 传牌技巧.md
    condition:
      type: and
      conditions:
        - field: teammate_straight_count
          op: ">="
          value: 2
    actions:
      - action_type: Pair
        score_adjust: 80
        description: 鼓励送对子
    priority: 6
    game_phase: midgame

  # 规则5：队友被拦截的牌型，继续送
  - id: teammate_blocked_continue_send
    name: 传队友被拦截的牌
    description: 队友出某个牌型被对手拦截，未能回收，他手中大概率还有该类牌型要出
    source: 传牌技巧.md
    condition:
      type: and
      conditions:
        - field: teammate_last_blocked
          op: "=="
          value: true
        - field: teammate_blocked_type
          op: "!="
          value: null
    actions:
      - action_type: other
        score_adjust: 100
        description: 鼓励送队友被拦截的牌型
    priority: 8
    game_phase: midgame

  # 规则6：高单传牌
  - id: high_single_passing
    name: 高单传牌
    description: 将较大的单牌（10、J、Q、K）传递给队友，帮助队友组成更好的牌型或压制对手
    source: 传牌技巧.md
    condition:
      type: and
      conditions:
        - field: role
          op: "=="
          value: "助攻"
        - field: has_single_advantage
          op: "=="
          value: true
    actions:
      - action_type: Single
        score_adjust: 60
        description: 鼓励出高单传牌
    priority: 5
    game_phase: midgame

  # 规则7：队友不要当前牌型，观察需要什么
  - id: teammate_pass_observe_need
    name: 队友不要观察需求
    description: 队友不要（PASS），说明队友可能不需要当前牌型，应该观察队友需要什么牌型
    source: 传牌技巧.md
    condition:
      type: and
      conditions:
        - field: teammate_last_action
          op: "=="
          value: "PASS"
        - field: cur_pos
          op: "=="
          value: "teammate_pos"
    actions:
      - action_type: PASS
        score_adjust: 50
        description: 鼓励观察队友需求
    priority: 4
    game_phase: midgame

