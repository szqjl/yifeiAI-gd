# 组牌技巧规则
# 从 docs/knowledge/skills/07_opening/04_card_grouping_skills.md 提取

rules:
  # 规则1：炸弹越多越好，单牌越少越好
  - id: bomb_max_single_min
    name: 炸弹越多越好，单牌越少越好
    description: 组牌第一原则，优先考虑单牌越少越好，同时考虑炸弹越多越好
    source: 组牌技巧.md
    condition:
      type: and
      conditions:
        - field: phase
          op: "=="
          value: "opening"
    actions:
      - action_type: Bomb
        score_adjust: 30
        description: 鼓励保留炸弹
      - action_type: Single
        score_adjust: -20
        description: 惩罚产生单牌
    priority: 8
    game_phase: opening

  # 规则2：主攻组牌轮次越少越好
  - id: main_attack_min_rounds
    name: 主攻组牌轮次优先
    description: 主攻组牌轮次越少越好，可以拆炸弹减少轮次
    source: 组牌技巧.md
    condition:
      type: and
      conditions:
        - field: role
          op: "=="
          value: "主攻"
        - field: phase
          op: "=="
          value: "opening"
    actions:
      - action_type: other
        score_adjust: 50
        description: 鼓励减少轮次的组牌方式
    priority: 7
    game_phase: opening

  # 规则3：助攻保留炸弹
  - id: assist_attack_keep_bomb
    name: 助攻保留炸弹
    description: 助攻组牌保留炸弹，必要时阻击对方
    source: 组牌技巧.md
    condition:
      type: and
      conditions:
        - field: role
          op: "=="
          value: "助攻"
        - field: phase
          op: "=="
          value: "opening"
    actions:
      - action_type: Bomb
        score_adjust: 40
        description: 鼓励保留炸弹
    priority: 7
    game_phase: opening

  # 规则4：拆4头炸组同花顺的条件
  - id: break_4_bomb_for_flush
    name: 拆4头炸组同花顺
    description: 拆4头炸产生赘牌不超过两张，可以组同花顺；超过两张，一般不组同花顺
    source: 组牌技巧.md
    condition:
      type: and
      conditions:
        - field: phase
          op: "=="
          value: "opening"
        - field: can_form_straight_flush
          op: "=="
          value: true
    actions:
      - action_type: StraightFlush
        score_adjust: 60
        description: 如果赘牌<=2张，鼓励组同花顺
    priority: 6
    game_phase: opening

  # 规则5：组顺生两单，肯定没眼光
  - id: avoid_straight_creates_two_singles
    name: 组顺生两单避免
    description: 如果由于组顺子而造出两张以上单牌，则应放弃
    source: 组牌技巧.md
    condition:
      type: and
      conditions:
        - field: phase
          op: "=="
          value: "opening"
        - field: straight_creates_singles
          op: ">="
          value: 2
    actions:
      - action_type: Straight
        score_adjust: -30
        description: 惩罚产生过多单牌的组顺
    priority: 8
    game_phase: opening

  # 规则6：主攻牌型套路化
  - id: main_attack_consistent_pattern
    name: 主攻牌型套路化
    description: 主攻牌型尽量一致，保持连续进攻，一种牌型有小、中、大
    source: 组牌技巧.md
    condition:
      type: and
      conditions:
        - field: role
          op: "=="
          value: "主攻"
        - field: phase
          op: "=="
          value: "opening"
    actions:
      - action_type: other
        score_adjust: 40
        description: 鼓励保持牌型一致性
    priority: 6
    game_phase: opening

  # 规则7：助攻牌型多样化
  - id: assist_attack_diverse_pattern
    name: 助攻牌型多样化
    description: 助攻尽量保持牌型多样，关键时候送队友
    source: 组牌技巧.md
    condition:
      type: and
      conditions:
        - field: role
          op: "=="
          value: "助攻"
        - field: phase
          op: "=="
          value: "opening"
    actions:
      - action_type: other
        score_adjust: 30
        description: 鼓励保持牌型多样性
    priority: 5
    game_phase: opening

